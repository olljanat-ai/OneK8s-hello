name: Build DB Hello App

# Builds the Azure SQL example application's container image and publishes it
# to GHCR. Same shape as Build Hello App, and a separate workflow for the same
# reason the two applications are separate directories: a change to one should
# not rebuild — or be able to break — the other.
#
# This one has no production stage to be promoted to: db-hello is deployed to
# Azure and nowhere else, so a merge to main is the whole of its release.
#
# The image is built into the runner's own Docker daemon, scanned by Aikido and
# only then pushed; Aikido watches GHCR as well, so this is the early half of a
# two-part arrangement rather than the only place images are looked at. See
# docs/container-image-scanning.md.
#
# Pull requests build but do not push, so a change to the app is compiled and
# containerised before it is merged without publishing anything.
on:
  push:
    branches: [main]
    paths:
      - "apps/db-hello/**"
      - ".github/workflows/build-db-hello.yml"
  pull_request:
    paths:
      - "apps/db-hello/**"
      - ".github/workflows/build-db-hello.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-db-hello-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: image (ghcr.io)
    runs-on: ubuntu-latest
    env:
      # Read at the job level rather than in the step, because a step's `if:`
      # cannot see a secret directly. Empty means Aikido has not been set up
      # for this repository, and the scan below is skipped rather than failed.
      AIKIDO_API_KEY: ${{ secrets.AIKIDO_API_KEY }}
      # Optional repository *variables*: the Aikido team that owns the image —
      # the only ownership wiring Aikido reads, since it does not look at image
      # labels — and low|medium|high|critical to turn the scan from a report
      # into a release gate. See the same pair in build-hello.yml.
      AIKIDO_TEAM: ${{ vars.AIKIDO_TEAM }}
      AIKIDO_FAIL_ON: ${{ vars.AIKIDO_FAIL_ON }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action lowercases the image name, which matters here: the
      # repository is "OneK8s-hello" and GHCR only accepts lowercase paths.
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/db-hello
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
          # Title and description are overridden because metadata-action's
          # defaults are the *repository's*, and this repository publishes two
          # images: left alone, both arrive in GHCR — and in a scanner's
          # container inventory — under the same name.
          #
          # image.source is not set here and must not be: metadata-action
          # already derives it, and GitHub reads it to attach the package to
          # this repository. That link is what "Inherit access from source
          # repository" hangs off, which is the setting Aikido needs to be able
          # to read the package at all, and what gets a finding back to the
          # Dockerfile that caused it.
          labels: |
            org.opencontainers.image.title=db-hello
            org.opencontainers.image.description=Welcome page reading and writing an Azure SQL Database as the tenant's own managed identity, with no credential of any kind.
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/blob/main/docs/db-hello-app.md
            org.opencontainers.image.vendor=OneK8s

      # linux/amd64 only: this one only ever runs on AKS, whose node pool is
      # x86 like every other foundation's.
      #
      # Loaded into the runner's Docker daemon rather than pushed, so the scan
      # below has something to open and so a gating scan stops the image from
      # being published at all rather than reporting on one that already is.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: apps/db-hello
          platforms: linux/amd64
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Aikido unpacks the layers and builds its own SBOM, so nothing has to be
      # attached to the image for the scan to work; --output-cyclonedx-json
      # asks for a copy on the way past, kept with the run below.
      #
      # Scanned under the immutable "sha-" tag rather than "latest", even
      # though both name the same bytes here: reporting a scan under a moving
      # tag makes every future build look like a new state of one container
      # instead of a container of its own.
      - name: Aikido image scan
        if: env.AIKIDO_API_KEY != '' && github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          image=$(printf '%s\n' "$TAGS" | grep ':sha-' | head -n1 || true)
          if [ -z "$image" ]; then
            image=$(printf '%s\n' "$TAGS" | head -n1)
          fi
          # The scanner runs as its own user inside the container; the output
          # directory has to be writable by whoever that turns out to be.
          mkdir -p sbom && chmod 777 sbom

          scan=(image-scan "$image" --output-cyclonedx-json /out/db-hello.cdx.json)
          if [ -n "$AIKIDO_TEAM" ]; then
            scan+=(--linked-team-name "$AIKIDO_TEAM")
          fi
          if [ -n "$AIKIDO_FAIL_ON" ]; then
            scan+=(--fail-on "$AIKIDO_FAIL_ON")
          fi

          # The key goes in as an environment variable rather than --apikey:
          # arguments are visible to anything that can list processes on the
          # runner, and end up in the scanner's own diagnostics.
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/sbom:/out" \
            -e AIKIDO_API_KEY \
            aikidosecurity/local-scanner "${scan[@]}"

      # always(), because the run this is evidence about is exactly the run
      # where the gate fired: a build rejected for a critical CVE is the one
      # whose inventory somebody is going to want to read.
      - name: Keep the SBOM with the build
        if: always() && env.AIKIDO_API_KEY != '' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: sbom-db-hello-${{ github.sha }}
          path: sbom/*.json
          if-no-files-found: warn

      # Comes back out of the layer cache the build above just filled, so this
      # re-exports the bytes that were scanned rather than building them again.
      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: apps/db-hello
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha

      - name: Summary
        if: always()
        run: |
          {
            echo "### DB Hello image"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            if [ -z "${AIKIDO_API_KEY}" ]; then
              echo "_Not scanned: \`AIKIDO_API_KEY\` is not set — see [container image scanning](https://github.com/${{ github.repository }}/blob/main/docs/container-image-scanning.md)._"
            elif [ -n "${AIKIDO_FAIL_ON}" ]; then
              echo "Scanned by Aikido, gating on **${AIKIDO_FAIL_ON}** and above."
            else
              echo "Scanned by Aikido (report only — set the \`AIKIDO_FAIL_ON\` variable to gate)."
            fi
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "_Built only — pull requests do not push._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
