name: Build DB Hello App

# Builds the Azure SQL example application's container image and publishes it
# to GHCR. Same shape as Build Hello App, and a separate workflow for the same
# reason the two applications are separate directories: a change to one should
# not rebuild — or be able to break — the other.
#
# This one has no production stage to be promoted to: db-hello is deployed to
# Azure and nowhere else, so a merge to main is the whole of its release.
#
# Pull requests build but do not push, so a change to the app is compiled and
# containerised before it is merged without publishing anything.
on:
  push:
    branches: [main]
    paths:
      - "apps/db-hello/**"
      - ".github/workflows/build-db-hello.yml"
  pull_request:
    paths:
      - "apps/db-hello/**"
      - ".github/workflows/build-db-hello.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-db-hello-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: image (ghcr.io)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action lowercases the image name, which matters here: the
      # repository is "OneK8s-hello" and GHCR only accepts lowercase paths.
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/db-hello
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-

      # linux/amd64 only: this one only ever runs on AKS, whose node pool is
      # x86 like every other foundation's.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: apps/db-hello
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### DB Hello image"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "_Built only — pull requests do not push._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
