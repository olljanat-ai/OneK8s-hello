name: Build DB Java App

# Builds the Java version of the Azure SQL example application's container
# image and publishes it to GHCR. Same shape as Build DB Hello App, and a
# separate workflow for the same reason the applications are separate
# directories: a change to one should not rebuild — or be able to break — the
# others. It is the only workflow here that compiles Java, so a broken pom or a
# source that does not build stops at this job and nowhere else.
#
# This one has no production stage to be promoted to either: db-java is
# deployed to Azure and nowhere else, so a merge to main is the whole of its
# release.
#
# Pull requests build but do not push, so a change to the app is compiled and
# containerised before it is merged without publishing anything.
on:
  push:
    branches: [main]
    paths:
      - "apps/db-java/**"
      - ".github/workflows/build-db-java.yml"
  pull_request:
    paths:
      - "apps/db-java/**"
      - ".github/workflows/build-db-java.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-db-java-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: image (ghcr.io)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action lowercases the image name, which matters here: the
      # repository is "OneK8s-hello" and GHCR only accepts lowercase paths.
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/db-java
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-

      # linux/amd64 only: this one only ever runs on AKS, whose node pool is
      # x86 like every other foundation's.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: apps/db-java
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### DB Java image"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "_Built only — pull requests do not push._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
