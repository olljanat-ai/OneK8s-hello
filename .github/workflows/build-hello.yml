name: Build Hello App

# Builds the example .NET application's container image and publishes it to
# GHCR. From here Kargo takes over, and the two stages part company:
#
#   staging     Azure/AKS   Kargo promotes the new build automatically
#   production  AWS/EKS     waits for a person, and takes only what staging ran
#
# So this workflow publishes an image and nothing more; what happens to it is
# the delivery plane's business (see docs/hello-app.md).
#
# One immutable tag per build and no moving tag at all. That is a deliberate
# constraint rather than an omission: Kargo identifies a release by its tag, and
# a tag that can point at a different image tomorrow would make "production runs
# sha-a1b2c3d" a statement with no content — and would let a pod that restarted
# for its own reasons pull a build nobody promoted.
#
# Pull requests build but do not push, so a change to the app is compiled and
# containerised before it is merged without publishing anything.
on:
  push:
    branches: [main]
    paths:
      - "apps/hello/**"
      - ".github/workflows/build-hello.yml"
  pull_request:
    paths:
      - "apps/hello/**"
      - ".github/workflows/build-hello.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-hello-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: image (ghcr.io)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action lowercases the image name, which matters here: the
      # repository is "OneK8s-hello" and GHCR only accepts lowercase paths.
      #
      # One tag, "sha-<short>", matching the pattern the Warehouse in
      # OneK8s-argocd allows (apps.hello.image.tagRegex). Adding a moving tag
      # here would not break the promotion — Kargo would ignore it — but it
      # would put a second, ungated way to change what a cluster runs back in
      # the registry.
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/hello
          tags: |
            type=sha,format=short,prefix=sha-

      # linux/amd64 only: every foundation's node pool is x86 today
      # (VM.Standard.E2.1, t3.small, e2-medium, the AKS default).
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: apps/hello
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Hello image"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "_Built only — pull requests do not push._"
            else
              echo "Kargo turns this into Freight and promotes it to **staging** (Azure)."
              echo "**Production** (AWS) waits for a person to promote it, and can only"
              echo "take what staging has already run — see"
              echo "[the release path](https://github.com/olljanat-ai/OneK8s-argocd#the-release-path)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
