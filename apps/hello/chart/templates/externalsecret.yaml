{{- if not .Values.secret.remoteKey }}
{{- fail "secret.remoteKey is required: the key this tenant's identity may read in the cluster's secret backend (the ApplicationSet sets it per cloud)" }}
{{- end }}
# The whole point of the app, in eight lines of YAML: it names a secret and a
# store, and never a credential. Authentication is the tenant's ServiceAccount
# exchanged for the tenant's cloud identity through workload identity
# federation, and that identity can only read this tenant's slice of the shared
# backend — enforced by Key Vault ABAC, an IAM ARN prefix, a Secret Manager IAM
# condition or an OCI policy condition, depending on which cluster this landed
# on. See docs/adr/0001-per-tenant-identities-and-namespaced-secretstores.md.
#
# "tenant-store" is a SecretStore, not a ClusterSecretStore: it exists only in
# this namespace and only ExternalSecrets in this namespace may reference it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "hello.name" . }}
  labels:
    {{- include "hello.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secret.storeName }}
    kind: SecretStore
  target:
    name: {{ include "hello.secretName" . }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.secret.name }}
      remoteRef:
        # A value, not a rule: how the backend spells this tenant's names is
        # the platform's business, and it is passed in already resolved.
        # Asking for anything outside the tenant's prefix is not a mistake that
        # passes quietly — the cloud IAM plane refuses the read and this object
        # goes SecretSyncedError.
        key: {{ .Values.secret.remoteKey | quote }}
