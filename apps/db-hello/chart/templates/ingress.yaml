{{- if not .Values.ingress.host }}
{{- fail "ingress.host is required (the ApplicationSet sets it to \"azure-db-hello.onek8s.lol\")" }}
{{- end }}
# Identical to the hello application's, and that is the point: an application
# that uses a cloud database is published exactly like one that does not. A
# host, a backend, and nothing else — no TLS block and no certificate, because
# Traefik's default TLSStore serves the platform wildcard.
#
# The A record for the host is created out of band, like every other host on
# this platform: no cluster writes the onek8s.lol zone.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "db-hello.name" . }}
  labels:
    {{- include "db-hello.labels" . | nindent 4 }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "db-hello.name" . }}
                port:
                  number: {{ .Values.service.port }}
